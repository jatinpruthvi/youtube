name: doc invariant

# The repository's one stated target is $1,500-$2,000 of profit per day, and
# scripts/check_docs.py is what keeps the docs honest about it. It runs here on
# every push so a monthly figure, a broken table, or a loosened label cannot
# land in the docs unnoticed.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: per-day goal invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No install step: the checks are stdlib-only Python (3.11+ semantics, and
      # ubuntu-latest ships a newer python3), so there is nothing to set up.
      - name: Check the docs
        run: |
          python3 -V
          python3 scripts/check_docs.py

      # tracker/items.json is the source of truth the tracker CLI and
      # docs/TRACKER.md are generated from, so it is loaded on every push too.
      # This catches a file that will not parse or is missing a field the CLI
      # reads. It does NOT check the dependency graph: track.py has no cycle,
      # dangling-dependency, duplicate-ID or enum check, so `summary` exits 0 on
      # a cyclic DAG or an invalid status.
      - name: Check the tracker loads
        run: python3 scripts/track.py summary
